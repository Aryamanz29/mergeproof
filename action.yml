name: mergeproof
description: Evidence gate for pull requests. Enforces the mergeproof.yaml policy in the repository and reports on the PR.
branding:
  icon: shield
  color: purple

inputs:
  policy:
    description: Path to the policy file
    default: mergeproof.yaml
  version:
    description: pip requirement for mergeproof (a version spec, a path, or a git URL)
    default: mergeproof
  plugins:
    description: Extra pip requirements, for example verifier plugins, separated by spaces
    default: ""
  comment:
    description: Create or update the sticky PR comment
    default: "true"
  check-run:
    description: Create the `mergeproof` Check Run with the report and file annotations (needs checks:write); require it in your ruleset
    default: "true"
  status:
    description: Also set a `mergeproof` commit status (needs statuses:write). Off by default because it duplicates the Check Run row
    default: "false"
  pending-ok:
    description: Succeed while evidence is still pending instead of failing the check
    default: "false"
  github-token:
    description: Token with pull-requests:write, statuses:write, checks:write
    default: ${{ github.token }}

outputs:
  verdict:
    description: pass, warn, pending or fail
    value: ${{ steps.gate.outputs.verdict }}
  report:
    description: Path of the JSON report
    value: mergeproof-report.json
  junit:
    description: Path of the JUnit XML rendering, for test-result reporters
    value: mergeproof-junit.xml
  rdjson:
    description: Path of the reviewdog rendering, for inline review comments
    value: mergeproof.rdjson

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet "${{ inputs.version }}" ${{ inputs.plugins }}
    - id: gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(check --github --policy "${{ inputs.policy }}" --output mergeproof-report.json)
        [ "${{ inputs.comment }}" = "true" ] && args+=(--comment)
        [ "${{ inputs.status }}" = "true" ] && args+=(--status)
        [ "${{ inputs.check-run }}" = "true" ] && args+=(--check-run)
        set +e
        mergeproof "${args[@]}"
        code=$?
        set -e
        if [ -f mergeproof-report.json ]; then
          mergeproof report mergeproof-report.json -f junit > mergeproof-junit.xml
          mergeproof report mergeproof-report.json -f rdjson > mergeproof.rdjson
        fi
        if [ "$code" = "2" ] && [ "${{ inputs.pending-ok }}" = "true" ]; then
          echo "evidence pending; not failing because pending-ok is set"
          exit 0
        fi
        exit "$code"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mergeproof-report
        path: |
          mergeproof-report.json
          mergeproof-junit.xml
          mergeproof.rdjson
        if-no-files-found: ignore
