site_name: mergeproof
site_description: Evidence gates for pull requests. Declare what a change must prove; CI enforces it; agents read the same file.
site_url: https://aryamanz29.github.io/mergeproof/
repo_url: https://github.com/Aryamanz29/mergeproof
repo_name: Aryamanz29/mergeproof
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle: { icon: material/weather-night, name: Dark theme }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle: { icon: material/weather-sunny, name: Light theme }
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quickstart: getting-started/quickstart.md
      - What a pull request sees: getting-started/what-you-see.md
  - Guides:
      - Writing a policy: guides/policy.md
      - Evidence: guides/evidence.md
      - Receipts: guides/receipts.md
      - GitHub setup: guides/github.md
      - Coding agents: guides/agents.md
      - Rolling it out: guides/rollout.md
      - Examples: guides/examples.md
  - Reference:
      - Checks: reference/checks.md
      - Command line: reference/cli.md
      - GitHub Action: reference/action.md
      - Policy schema: reference/schema.md
  - Extending:
      - Plugins: extending/plugins.md
  - Project:
      - Contributing: project/contributing.md
      - Releasing: project/releasing.md
      - Stability: project/stability.md
      - FAQ: project/faq.md
      - Changelog: project/changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Aryamanz29/mergeproof
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mergeproof/
