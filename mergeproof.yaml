# This repository gates itself.
version: 1
project: mergeproof

rules:
  - id: source-needs-tests
    description: A change to a module ships with a change to its tests.
    when:
      paths: ["src/mergeproof/**/*.py"]
      exclude_paths: ["src/mergeproof/__init__.py", "src/mergeproof/__main__.py", "src/mergeproof/mcp_server.py"]
    require:
      - check: tests.changed
        name: unit tests touched
        with:
          map:
            "src/mergeproof/checks/{name}.py": "tests/unit/test_checks.py"
            "src/mergeproof/providers/{name}.py": "tests/unit/test_providers.py"
            "src/mergeproof/verifiers/{name}.py": "tests/unit/test_verifiers.py"
            "src/mergeproof/render/{name}.py": "tests/unit/test_render.py"
            "src/mergeproof/{name}.py": "tests/unit/test_{name}*.py"
          ignore: ["src/mergeproof/checks/__init__.py", "src/mergeproof/checks/base.py", "src/mergeproof/checks/registry.py",
                   "src/mergeproof/verifiers/__init__.py", "src/mergeproof/verifiers/base.py", "src/mergeproof/render/__init__.py",
                   "src/mergeproof/providers/__init__.py", "src/mergeproof/report.py", "src/mergeproof/context.py"]
      - check: ci.job_passed
        name: unit tests green on every Python
        with: { name: "^unit \\(3\\.1[123]\\)$", regex: true, min_matches: 3 }
      - check: ci.job_passed
        name: integration green
        with: { name: "^integration$", regex: true }

  - id: mcp-server-has-integration-test
    description: The MCP server is only tested end to end, so a change there touches that test.
    when:
      paths: ["src/mergeproof/mcp_server.py"]
    require:
      - check: tests.changed
        with: { any_of: ["tests/integration/test_mcp.py"] }

  - id: examples-stay-runnable
    description: A changed example policy keeps or updates its scenarios.
    when:
      paths: ["examples/*/mergeproof.yaml"]
    require:
      - check: files.changed
        name: scenarios touched
        severity: warn
        with: { any_of: ["examples/*/scenarios/*.json"] }

  - id: conventional-title
    description: The changelog is generated from commit subjects, so a PR title that is not Conventional Commits will not appear in it.
    severity: warn
    when:
      title: "^(?!(feat|fix|perf|refactor|docs|test|ci|build|chore|release)(\\(.+\\))?!?: )"
    require:
      - check: pr.labels
        name: title follows Conventional Commits
        with: { any_of: ["changelog-not-needed"] }
        instructions: Rename the PR to `type(scope): summary` (feat, fix, docs, ci, test, refactor, chore), or add the `changelog-not-needed` label.
