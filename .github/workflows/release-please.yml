name: release-please

# Keeps one release PR open on main. It carries the next version (from conventional commits)
# and the changelog entry. Merging it creates the tag and the GitHub Release; release.yml and
# image.yml then publish to PyPI and GHCR from that tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # With RELEASE_PLEASE_TOKEN (a fine-grained PAT: contents and pull requests, read and write)
      # the release PR is opened as you and CI starts on it. With the workflow token it cannot
      # start CI; close and reopen the PR once and the checks run.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
