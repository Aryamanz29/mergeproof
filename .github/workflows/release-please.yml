name: release-please

# Keeps one release PR open on main. It carries the next version (from conventional commits)
# and the changelog entry. Merging it creates the tag and the GitHub Release; release.yml and
# image.yml then publish to PyPI and GHCR from that tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A token from the mergeproof GitHub App lets the release PR trigger CI. Without the
      # App configured, the workflow token is used and the release PR's checks must be
      # started by closing and reopening it once.
      - uses: actions/create-github-app-token@v1
        id: app
        if: ${{ vars.MERGEPROOF_APP_ID != '' }}
        with:
          app-id: ${{ vars.MERGEPROOF_APP_ID }}
          private-key: ${{ secrets.MERGEPROOF_APP_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
