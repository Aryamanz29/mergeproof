name: release-please

# Keeps one release PR open on main. It carries the next version (from conventional commits)
# and the changelog entry. Merging it creates the tag and the GitHub Release; release.yml and
# image.yml then publish to PyPI and GHCR from that tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The workflow token cannot trigger other workflows, so CI does not start on the release PR
      # by itself; close and reopen it once, or push to it, and the checks run.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
