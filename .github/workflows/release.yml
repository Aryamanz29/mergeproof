name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]   # release tags only; not the floating v0 / v1
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.3.0
        required: true

env:
  TAG: ${{ inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Refuse a release tag that does not match the package version
        run: |
          ref="${TAG:-$GITHUB_REF_NAME}"; tag="${ref#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$tag" = "$version" ] || { echo "tag v$tag but pyproject.toml says $version"; exit 1; }
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: "Move the floating major tag so uses: Aryamanz29/mergeproof@v0 follows this release"
        run: |
          ref="${TAG:-$GITHUB_REF_NAME}"; major="v${ref#v}"; major="${major%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "${TAG:-$GITHUB_REF_NAME}"
          git push -f origin "$major"
      - name: GitHub Release with the wheel and sdist attached (created here only if release-please has not)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${TAG:-$GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${TAG:-$GITHUB_REF_NAME}" --title "${TAG:-$GITHUB_REF_NAME}" --notes-file notes.md
          gh release upload "${TAG:-$GITHUB_REF_NAME}" dist/* --clobber

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing; no API token stored in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
