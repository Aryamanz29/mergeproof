name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync --extra mcp --extra otel --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest tests/unit --cov --cov-report=term-missing --cov-fail-under=85

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build the wheel and install it into a clean environment with the MCP extra and the example plugin
        run: |
          uv build
          uv venv .itenv
          uv pip install --no-sources --python .itenv/bin/python "$(ls dist/*.whl)[mcp,otel]" ./examples/plugins/mergeproof-langfuse pytest anyio respx
      - run: .itenv/bin/python -m pytest tests/integration -m integration -p no:cacheprovider
      - run: .itenv/bin/python -m pytest examples/plugins/mergeproof-langfuse/tests -p no:cacheprovider
        env:
          PYTHONPATH: ""

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the smoke test diffs against HEAD~1
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mergeproof:ci
      - name: Smoke test the image as a user would run it
        run: |
          docker run --rm mergeproof:ci --version
          docker run --rm -v "$PWD":/repo mergeproof:ci validate
          docker run --rm -v "$PWD":/repo mergeproof:ci check --local --base HEAD~1 || test $? -le 2
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}\n' \
            | docker run -i --rm -v "$PWD":/repo mergeproof:ci mcp | grep -q '"serverInfo"'

  gate:
    name: gate (this repo's own policy)
    if: github.event_name == 'pull_request'
    needs: [lint, unit, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      # With the mergeproof GitHub App configured (MERGEPROOF_APP_ID variable, MERGEPROOF_APP_KEY
      # secret), the comment, status and check run are posted as "mergeproof" with its avatar.
      - uses: actions/create-github-app-token@v1
        id: app
        if: ${{ vars.MERGEPROOF_APP_ID != '' }}
        with:
          app-id: ${{ vars.MERGEPROOF_APP_ID }}
          private-key: ${{ secrets.MERGEPROOF_APP_KEY }}
      - uses: ./
        id: gate
        with:
          version: "."
          pending-ok: "true"
          github-token: ${{ steps.app.outputs.token || github.token }}
      - name: Render the requirements as a test report
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('mergeproof-junit.xml') != ''
        with:
          check_name: mergeproof requirements
          files: mergeproof-junit.xml
          comment_mode: off
          action_fail: false
          action_fail_on_inconclusive: false
