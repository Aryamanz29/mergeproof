name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync --extra mcp --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  unit:
    name: unit (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --group dev --python ${{ matrix.python }}
      - run: uv run pytest tests/unit --cov --cov-report=term-missing --cov-fail-under=85

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build the wheel and install it into a clean environment with the MCP extra and the example plugin
        run: |
          uv build
          uv venv .itenv
          uv pip install --no-sources --python .itenv/bin/python "$(ls dist/*.whl)[mcp]" ./examples/plugins/mergeproof-langfuse pytest anyio respx
      - run: .itenv/bin/python -m pytest tests/integration -m integration -p no:cacheprovider
      - run: .itenv/bin/python -m pytest examples/plugins/mergeproof-langfuse/tests -p no:cacheprovider
        env:
          PYTHONPATH: ""

  gate:
    name: mergeproof (this repo's own policy)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: "."
          pending-ok: "true"
