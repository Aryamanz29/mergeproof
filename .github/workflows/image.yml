name: image

# Publishes ghcr.io/<owner>/mergeproof.
#   push to main  -> :edge
#   tag vX.Y.Z    -> :X.Y.Z, :X.Y, :X (from 1.0), :latest
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.3.0
        required: true

env:
  TAG: ${{ inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Refuse a release tag that does not match the package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        run: |
          ref="${TAG:-$GITHUB_REF_NAME}"; tag="${ref#v}"
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$tag" = "$version" ] || { echo "tag v$tag but pyproject.toml says $version"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/mergeproof
          tags: |
            type=raw,value=${{ inputs.tag && 'x' || '' }},enable=false
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
