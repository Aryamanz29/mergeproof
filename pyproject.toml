[project]
name = "mergeproof"
version = "0.1.0"
description = "Evidence gates for pull requests: declare what a change must prove, enforce it in CI, and hand agents the same rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aryaman Bhushan" }]
keywords = ["github-actions", "ci", "guardrails", "evidence", "agentic", "pull-request"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
mergeproof = "mergeproof.cli:main"

# Third-party packages register extra checks here:
# [project.entry-points."mergeproof.checks"]
# my_check = "my_pkg.checks:MyCheck"
[project.entry-points."mergeproof.checks"]
"tests.changed" = "mergeproof.checks.tests_changed:TestsChanged"
"evidence.field" = "mergeproof.checks.evidence_field:EvidenceField"
"evidence.traces" = "mergeproof.checks.traces:EvidenceTraces"
"ci.job_passed" = "mergeproof.checks.ci_job:CiJobPassed"
"review.human_verified" = "mergeproof.checks.human_verified:HumanVerified"
"pr.labels" = "mergeproof.checks.labels:Labels"
"pr.body" = "mergeproof.checks.body:Body"
"shell" = "mergeproof.checks.shell:Shell"
"agent.verdict" = "mergeproof.checks.agent_verdict:AgentVerdict"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mergeproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
