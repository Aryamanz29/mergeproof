<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-label="The mergeproof comment on a pull request">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
      .pill { font-size: 11px; font-weight: 600; fill: #ffffff; }
      .muted { fill: #656d76; }
      .ink { fill: #1f2328; }
      .link { fill: #0969da; }
      th { font-weight: 600; }
    </style>
  </defs>
  <rect width="880" height="560" fill="#ffffff"/>
  <rect x="10" y="10" width="860" height="540" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="10" y="10" width="860" height="40" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="10" y="30" width="860" height="20" fill="#f6f8fa"/>
  <line x1="10" y1="50" x2="870" y2="50" stroke="#d0d7de"/>
  <circle cx="34" cy="30" r="10" fill="#7c3aed"/>
  <text x="52" y="35" font-weight="600" class="ink">github-actions</text>
  <text x="160" y="35" class="muted">bot · commented 2 minutes ago</text>

  <!-- scorecard pills -->
  <g transform="translate(30 68)">
    <!-- mergeproof pill: dark label + purple value -->
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#1f2328"/>
    <rect x="30" y="0" width="0" height="20" fill="#1f2328"/>
    <g transform="translate(9 3) scale(0.055)">
      <path d="M128 18 L218 50 V126 C218 184 178 224 128 242 C78 224 38 184 38 126 V50 Z" fill="#ffffff"/>
      <circle cx="128" cy="172" r="22" fill="#7c3aed"/>
      <path d="M116 172 L125 181 L141 163" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="30" y="0" width="70" height="20" fill="#7c3aed"/>
    <path d="M97 0 h3 v20 h-3 z" fill="#7c3aed"/>
    <text x="65" y="14" text-anchor="middle" class="pill">mergeproof</text>

    <!-- 4 of 5 -->
    <rect x="110" y="0" width="106" height="20" rx="3" fill="#1f2328"/>
    <rect x="172" y="0" width="44" height="20" fill="#cf222e"/>
    <path d="M213 0 h3 v20 h-3 z" fill="#cf222e"/>
    <text x="141" y="14" text-anchor="middle" class="pill">satisfied</text>
    <text x="194" y="14" text-anchor="middle" class="pill">4 / 5</text>

    <!-- ci green -->
    <rect x="226" y="0" width="98" height="20" rx="23" fill="#1f2328"/>
    <rect x="282" y="0" width="42" height="20" fill="#2ea043"/>
    <path d="M321 0 h3 v20 h-3 z" fill="#2ea043"/>
    <text x="254" y="14" text-anchor="middle" class="pill">ci green</text>
    <text x="303" y="14" text-anchor="middle" class="pill">4 / 4</text>

    <!-- source needs tests -->
    <rect x="334" y="0" width="156" height="20" rx="23" fill="#1f2328"/>
    <rect x="448" y="0" width="42" height="20" fill="#cf222e"/>
    <path d="M487 0 h3 v20 h-3 z" fill="#cf222e"/>
    <text x="391" y="14" text-anchor="middle" class="pill">source needs tests</text>
    <text x="469" y="14" text-anchor="middle" class="pill">0 / 1</text>

    <!-- conventional title -->
    <rect x="500" y="0" width="150" height="20" rx="23" fill="#1f2328"/>
    <rect x="608" y="0" width="42" height="20" fill="#dbab09"/>
    <path d="M647 0 h3 v20 h-3 z" fill="#dbab09"/>
    <text x="554" y="14" text-anchor="middle" class="pill">conventional title</text>
    <text x="629" y="14" text-anchor="middle" class="pill">warn</text>
  </g>

  <!-- sentence -->
  <text x="30" y="118" class="ink"><tspan font-weight="700">4 of 5 requirements satisfied</tspan> for <tspan class="mono link">40395ea</tspan>. To merge:</text>

  <!-- Needed / What to do table -->
  <g transform="translate(30 134)">
    <rect x="0" y="0" width="820" height="30" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="12" y="20" font-weight="600" class="ink">Needed</text>
    <text x="300" y="20" font-weight="600" class="ink">What to do</text>
    <rect x="0" y="30" width="820" height="66" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="288" y1="0" x2="288" y2="96" stroke="#d0d7de"/>
    <!-- status pill -->
    <rect x="12" y="41" width="58" height="20" rx="3" fill="#cf222e"/>
    <text x="41" y="55" text-anchor="middle" class="pill">Missing</text>
    <text x="80" y="55" class="ink">unit tests touched</text>
    <text x="12" y="80" class="muted" font-size="12">source-needs-tests</text>
    <text x="300" y="52" class="ink">Add or change a test for each changed source file:</text>
    <text x="300" y="74" class="mono ink">checks/body.py → tests/unit/test_checks_body*.py</text>
  </g>

  <!-- instructions -->
  <text x="30" y="252" class="muted" font-size="12"><tspan font-weight="600">source-needs-tests</tspan>: a test that fails before the change and passes after it, in the module's own test file.</text>

  <!-- everything else -->
  <text x="30" y="286" font-weight="700" class="ink">Everything else</text>
  <g transform="translate(30 298)">
    <rect x="0" y="0" width="820" height="30" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="12" y="20" font-weight="600" class="ink">Requirement</text>
    <text x="300" y="20" font-weight="600" class="ink">Evidence</text>
    <line x1="288" y1="0" x2="288" y2="210" stroke="#d0d7de"/>

    <rect x="0" y="30" width="820" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="12" y="38" width="62" height="20" rx="3" fill="#dbab09"/>
    <text x="43" y="52" text-anchor="middle" class="pill">Warning</text>
    <text x="84" y="52" class="ink">conventional title</text>
    <text x="300" y="52" class="ink">title does not match <tspan class="mono">^(feat|fix|docs|…)(\(.+\))?!?: </tspan></text>

    <rect x="0" y="66" width="820" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="12" y="74" width="66" height="20" rx="3" fill="#2ea043"/>
    <text x="45" y="88" text-anchor="middle" class="pill">Satisfied</text>
    <text x="88" y="88" class="ink">lint is green</text>
    <text x="300" y="88" class="ink">check run <tspan class="mono">lint</tspan> succeeded on <tspan class="mono">40395ea</tspan></text>

    <rect x="0" y="102" width="820" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="12" y="110" width="66" height="20" rx="3" fill="#2ea043"/>
    <text x="45" y="124" text-anchor="middle" class="pill">Satisfied</text>
    <text x="88" y="124" class="ink">unit tests pass on every Python</text>
    <text x="300" y="124" class="ink">3 check runs matching <tspan class="mono">^unit \(</tspan> succeeded</text>

    <rect x="0" y="138" width="820" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="12" y="146" width="66" height="20" rx="3" fill="#2ea043"/>
    <text x="45" y="160" text-anchor="middle" class="pill">Satisfied</text>
    <text x="88" y="160" class="ink">integration is green</text>
    <text x="300" y="160" class="ink">check run <tspan class="mono">integration</tspan> succeeded on <tspan class="mono">40395ea</tspan></text>

    <rect x="0" y="174" width="820" height="36" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="12" y="182" width="66" height="20" rx="3" fill="#2ea043"/>
    <text x="45" y="196" text-anchor="middle" class="pill">Satisfied</text>
    <text x="88" y="196" class="ink">docker image builds</text>
    <text x="300" y="196" class="ink">check run <tspan class="mono">docker</tspan> succeeded on <tspan class="mono">40395ea</tspan></text>
  </g>

  <text x="30" y="536" class="muted" font-size="12">Evaluated <tspan class="mono">40395ea</tspan> against <tspan class="mono">mergeproof.yaml</tspan> on main · <tspan class="link">run</tspan> · <tspan class="link">mergeproof explain</tspan> shows the same locally</text>
</svg>
