# Copy to .github/workflows/mergeproof.yml. Re-runs whenever anything the gate reads can change:
# the diff, the description, labels, CI results, and comments (where /verified and verdicts land).
# `closed` is for the receipt: when the PR merges, the final report is stored on a branch.
name: mergeproof
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, closed]
  issue_comment:
    types: [created, edited]
  check_suite:
    types: [completed]

jobs:
  gate:
    name: 🛡️ mergeproof        # the job name is free text; GitHub renders the emoji on the checks list
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the receipt branch; `read` is enough without receipts
      pull-requests: write
      statuses: write
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # read the policy from the base branch
      - uses: Aryamanz29/mergeproof@v1   # floating major; pin @v1.0.0 for an exact release
        with:
          policy: mergeproof.yaml
          pending-ok: "false"
        env:
          MERGEPROOF_PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
