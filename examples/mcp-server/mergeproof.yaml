# An MCP server whose tools are called by LLM agents. Behaviour changes are easy to claim
# and hard to see, so a fix has to show itself on a live deployment: a trace of the broken
# call, a trace of the fixed call, and a human who opened both.
#
# Traces live in Langfuse (open source, self-hosted). Links are verified by the
# mergeproof-langfuse plugin; drop the `verify:` line to accept well-formed links only.
version: 1
project: example-mcp-server

rules:
  - id: tool-change-needs-unit-tests
    description: Every changed tool module ships with changed unit tests for that module.
    when:
      paths: ["server/tools/**/*.py"]
      exclude_paths: ["server/tools/__init__.py", "server/tools/models.py"]
    require:
      - check: tests.changed
        name: unit tests for touched tools
        with:
          map:
            "server/tools/{name}.py": "tests/unit/**/test_{name}*.py"
        instructions: A regression test that fails before the fix and passes after it.
      - check: ci.job_passed
        name: unit tests green
        with: { name: "^unit", regex: true }

  - id: tool-change-needs-integration-tests
    description: Tool behaviour is covered by the integration suite that talks to a real deployment.
    when:
      paths: ["server/tools/**/*.py"]
      exclude_paths: ["server/tools/__init__.py", "server/tools/models.py"]
    require:
      - check: tests.changed
        name: integration tests touched
        severity: warn
        with: { any_of: ["tests/integration/**/*.py"] }
      - check: ci.job_passed
        name: integration tests green
        with: { name: "^integration", regex: true }

  - id: fix-needs-live-evidence
    description: Fixes and features prove the behaviour change on the staging deployment with before/after traces.
    when:
      paths: ["server/**/*.py"]
      exclude_paths: ["tests/**"]
      title: "^(fix|feat)(\\(|:|!)"
    instructions: >
      Deploy the branch image to staging, reproduce the problem and keep the trace link, then
      repeat the same call against the fixed image and keep that link too.
    require:
      - check: evidence.field
        name: tested on staging
        with: { key: environment, equals: staging }
      - check: evidence.field
        name: image under test
        with: { key: image, matches: "^[\\w.\\-/]+:[\\w.\\-]+$", example: "<registry>/mcp-server:pr-<n>-<sha7>" }
      - check: evidence.links
        name: before/after traces
        with:
          key: traces
          min_pairs: 1
          pattern: "^(?P<host>https?://[^/]+)/project/(?P<project>[^/]+)/traces/(?P<trace_id>[\\w-]+)"
          verify: langfuse
          example: "https://langfuse.example.com/project/<project-id>/traces/<trace-id>"
      - check: review.human_verified
        name: reviewer opened the traces
        with: { accept_approval: true, bind_to_head: true }
        instructions: >
          Reviewer: open both traces, confirm the after-trace shows the intended behaviour, then
          approve the pull request (or comment `/verified <7-char head sha>`). A new push asks
          for a fresh approval.

  - id: prompt-change-needs-eval
    description: A prompt or model change is evaluated on the golden dataset and stays above the bar.
    when:
      paths: ["prompts/**", "server/models.yaml"]
    instructions: >
      Run the `search-golden` dataset against the branch in Langfuse and paste the run under
      `eval` in the evidence block. The run must score at least 0.8 on `correctness`.
    require:
      - check: langfuse.eval
        name: golden dataset run
        with:
          key: eval
          scorers: { correctness: 0.8 }
          example: "https://langfuse.example.com/project/<project-id>/datasets/search-golden/runs/<run-name>"

  - id: automated-review
    description: The repository's review agent has looked at the change and had nothing blocking to say.
    when:
      paths: ["server/**"]
    require:
      - check: agent.verdict
        name: review agent verdict
        with: { name: mcp-review, authors: ["github-actions[bot]"], min_confidence: 0.7 }
