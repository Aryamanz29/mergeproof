[project]
name = "mergeproof-langfuse"
version = "0.1.0"
description = "mergeproof plugin: verify before/after trace links against a Langfuse instance."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mergeproof>=0.2", "httpx>=0.27,<1"]

[project.entry-points."mergeproof.verifiers"]
langfuse = "mergeproof_langfuse:LangfuseVerifier"

[project.entry-points."mergeproof.checks"]
"langfuse.traces" = "mergeproof_langfuse:LangfuseTraces"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mergeproof_langfuse"]

[tool.uv.sources]
mergeproof = { path = "../../..", editable = true }
